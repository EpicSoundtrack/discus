<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'">
  <title>Discus</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav class="tabs">
      <button class="tab active" data-panel="scanner">Scanner</button>
      <button class="tab" data-panel="results">Results</button>
      <button class="tab" data-panel="review">Review Folder</button>
    </nav>
    <div class="gpu-badge" id="gpu-badge">CPU Mode</div>
  </header>

  <div id="warning-banner" class="warning hidden">
    ⚠ AI suggestions unavailable — DISCUS env var not set
  </div>

  <main>
    <!-- Scanner Panel -->
    <section id="panel-scanner" class="panel active">
      <div class="scanner-controls">
        <label for="drive-select">Drive:</label>
        <select id="drive-select"></select>
        <button id="start-scan">Start Scan</button>
      </div>
      <div class="progress-area" id="progress-area" style="display:none">
        <progress id="scan-progress" value="0" max="100"></progress>
        <span id="progress-text">0 / ~0 files</span>
        <span id="elapsed-time">00:00:00</span>
        <div id="current-path" class="mono"></div>
      </div>
    </section>

    <!-- Results Panel -->
    <section id="panel-results" class="panel" style="display:none">
      <div id="results-summary" class="results-summary hidden">
        <span id="summary-groups">0 duplicate groups found</span>
        <span class="sep">|</span>
        <span id="summary-wasted">0 B wasted</span>
      </div>
      <button id="show-all-toggle" class="link-btn" style="display:none"></button>
      <div id="results-empty" class="empty-state">Run a scan to see results.</div>
      <div class="bulk-actions hidden" id="bulk-actions">
        <button id="select-suggested">Select All Suggested</button>
        <button id="move-selected">Move Selected to Review</button>
      </div>
      <div id="groups-list"></div>
    </section>

    <!-- Review Folder Panel -->
    <section id="panel-review" class="panel" style="display:none">
      <div class="review-toolbar">
        <button id="refresh-review">Refresh</button>
        <button id="empty-review" class="danger">Empty Review Folder</button>
      </div>
      <div id="review-empty" class="empty-state">Review folder is empty.</div>
      <div id="review-list"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
